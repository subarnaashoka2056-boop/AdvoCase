# Allocate memory for the Gradle daemon to build smoothly on GitHub Actions
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use modern AndroidX libraries
android.useAndroidX=true

# Enables namespacing for each library's R class so that its R class includes only the resources declared in the library itself
android.nonTransitiveRClass=true

# Kotlin official code style
kotlin.code.style=official
